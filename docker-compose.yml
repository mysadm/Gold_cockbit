name: gold-cockpit

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gold_cockpit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gold_cockpit
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gold_cockpit"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      # Context is the parent of both repos — see Dockerfile comment.
      context: ..
      dockerfile: gold-cockpit/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gold_cockpit:${POSTGRES_PASSWORD}@db:5432/gold_cockpit
      SHARED_AI_API_KEY: ${SHARED_AI_API_KEY:-}
      SHARED_AI_DAILY_LIMIT: ${SHARED_AI_DAILY_LIMIT:-2}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
    command: sh -c "node db/migrate.mjs && (npm run server & npm run dev -- --host 0.0.0.0)"
    ports:
      - "3577:3577" # frontend (vite dev, proxies /api itself)
      - "8787:8787" # API, exposed for direct debugging only

volumes:
  db_data:
